<meta charset="UTF-8">

<style>
    /* Contenedor flexible para centrar el cuadro dentro del área activa */
    .whatsapp-wrapper {
        min-height: 70vh;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
    }

    /* Tarjeta centrada con tamano controlado */
    .whatsapp-card {
        max-width: 500px;
        width: 100%;
        border: none;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        background-color: #ffffff;
        padding: 40px 30px;
        text-align: center;
    }

    /* Boton personalizado de WhatsApp */
    .btn-whatsapp-custom {
        background-color: #25d366;
        color: #ffffff;
        font-weight: 600;
        font-size: 1.1rem;
        padding: 12px 28px;
        border-radius: 8px;
        border: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-decoration: none;
        transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .btn-whatsapp-custom:hover {
        background-color: #1eb956;
        color: #ffffff;
        transform: translateY(-2px);
    }
</style>

<div class="whatsapp-wrapper">
